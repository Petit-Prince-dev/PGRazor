name: Sync upstream release (fork)
# Once a day: when jpitty03/PGRazor publishes a new release (usually for a new Pokémon GO version),
# merge that release into this fork, point pgrazor/FORK_BASE at it and start a new FR release. A merge
# conflict (for example with the French texts) stops here and GitHub emails you; resolve it by hand.
on:
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  sync:
    if: github.repository != 'jpitty03/PGRazor'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Merge the newest upstream release
        id: merge
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          latest=$(gh api repos/jpitty03/PGRazor/releases/latest --jq .tag_name)
          current=$(tr -d '[:space:]' < pgrazor/FORK_BASE)
          echo "upstream=$latest fork base=$current"
          if [ -z "$latest" ] || [ "$latest" = "$current" ]; then echo "changed=false" >> "$GITHUB_OUTPUT"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch https://github.com/jpitty03/PGRazor.git "refs/tags/$latest:refs/tags/upstream-$latest"
          git merge --no-edit -m "Merge upstream PGRazor $latest" "upstream-$latest"
          printf '%s\n' "$latest" > pgrazor/FORK_BASE
          git commit -am "Base the FR release on upstream $latest"
          git push origin HEAD:main
          echo "changed=true" >> "$GITHUB_OUTPUT"
      - name: Start a new FR release
        if: steps.merge.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run fork-root-release.yml --ref main
