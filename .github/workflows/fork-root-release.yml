name: Release Root FR (fork)
# Builds this fork's PGRazor Root module (Java controls from this repository, native payload from the
# upstream release in pgrazor/FORK_BASE) and publishes it as the latest release. Phones running the
# module pick it up by themselves through the root helper (dev.pgrazor.RootDaemon). No game APK or
# signing secret is needed. Never runs in the upstream repository.
on:
  push:
    branches: [main]
    paths:
      - 'pgrazor/src/**'
      - 'pgrazor/root-installer/**'
      - 'pgrazor/FORK_BASE'
      - 'pgrazor/rooted.py'
      - 'pgrazor/rooted_installer.py'
      - 'tools/fork_root_release.py'
      - '.github/workflows/fork-root-release.yml'
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag (empty = <FORK_BASE>-fr.<run number>)
        required: false
        type: string
permissions:
  contents: read
concurrency:
  group: fork-root-release
  cancel-in-progress: false
jobs:
  release:
    if: github.repository != 'jpitty03/PGRazor'
    runs-on: windows-latest
    timeout-minutes: 30
    permissions:
      contents: write
    defaults:
      run:
        shell: pwsh
    env:
      PGRAZOR_BUILD_TOOLS: 36.0.0
      PGRAZOR_ANDROID_PLATFORM: android-36
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Install Android SDK
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - name: Choose the release tag
        env:
          INPUT_TAG: ${{ inputs.tag }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          $base = (Get-Content -Raw pgrazor/FORK_BASE).Trim()
          $tag = if ($env:INPUT_TAG) { $env:INPUT_TAG } else { "$base-fr.$env:RUN_NUMBER" }
          if ($tag -notmatch '^v[0-9]+\.[0-9]+\.[0-9]+(-[A-Za-z0-9]+([.-][A-Za-z0-9]+)*)?$') { throw "Invalid tag $tag" }
          Add-Content -LiteralPath $env:GITHUB_ENV -Value "RELEASE_TAG=$tag"
      - name: Device-free checks
        run: python -B -m unittest discover -s pgrazor/test -p "test_rooted_packaging.py"
      - name: Build the module
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          python -B tools/fork_root_release.py --tag $env:RELEASE_TAG --repo $env:GITHUB_REPOSITORY --output dist/fork --installer
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_COMMIT: ${{ github.sha }}
        run: |
          $notes = "Module PGRazor Root traduit en français, avec l'extinction de l'écran en jeu.`n`nInstallation ou mise à jour : PGRazor-Root-module.zip dans KernelSU / Magisk / APatch, puis redémarrage."
          gh release create $env:RELEASE_TAG dist/fork/PGRazor-Root-module.zip dist/fork/PGRazor-Root.apk dist/fork/SHA256SUMS.txt dist/fork/root-build-info.json dist/fork/changelog.md --target $env:RELEASE_COMMIT --title "PGRazor Root FR $env:RELEASE_TAG" --latest --notes $notes
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
